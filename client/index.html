<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI LOUNGE AFTER DARK</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/favicon.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Press Start 2P', system-ui;
            color: #00f0ff;
        }
        
        canvas {
            display: block;
        }
        
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        #chat {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 380px;
            background: rgba(10, 5, 25, 0.85);
            border: 2px solid #9d00ff;
            border-radius: 0;
            box-shadow: 0 0 30px #9d00ff;
            pointer-events: all;
        }
        
        #chat-messages {
            height: 220px;
            overflow-y: auto;
            padding: 15px;
            font-size: 12px;
            line-height: 1.4;
            color: #00f0ff;
            background: rgba(0, 0, 0, 0.4);
        }
        
        #chat-input-container {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ff2a2a;
        }
        
        #chat-input {
            flex: 1;
            background: #110022;
            border: 1px solid #00f0ff;
            color: #fff;
            padding: 8px 12px;
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            outline: none;
        }
        
        #chat-input:focus {
            border-color: #ff00aa;
            box-shadow: 0 0 15px #ff00aa;
        }
        
        .message {
            margin-bottom: 6px;
            word-break: break-word;
        }
        
        .system {
            color: #ff2a2a;
            font-style: italic;
        }
        
        #instructions {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(10, 5, 25, 0.9);
            border: 2px solid #00ffff;
            padding: 15px;
            max-width: 280px;
            font-size: 11px;
            line-height: 1.5;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.5);
        }
        
        #title {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 6px;
            text-shadow: 
                0 0 10px #9d00ff,
                0 0 20px #9d00ff,
                0 0 40px #ff00aa;
            color: #fff;
            pointer-events: none;
            text-align: center;
            z-index: 20;
            animation: neon-flicker 1.5s infinite alternate;
        }
        
        @keyframes neon-flicker {
            0% { opacity: 0.85; }
            100% { opacity: 1; }
        }
        
        .neon-text {
            text-shadow: 
                0 0 5px #00f0ff,
                0 0 10px #00f0ff,
                0 0 20px #9d00ff,
                0 0 40px #ff2a2a;
        }
        
        #fps {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 10px;
            font-size: 11px;
            border: 1px solid #00ff9d;
            color: #00ff9d;
        }
    </style>
</head>
<body>
    <div id="title">AI LOUNGE<br>AFTER DARK</div>
    <div id="fps">FPS: --</div>
    
    <div id="ui">
        <div id="instructions">
            <strong style="color:#ff00aa">CONTROLS</strong><br>
            WASD — Move<br>
            MOUSE — Look around (coming)<br>
            ENTER — Send chat<br><br>
            
            <span style="color:#9d00ff">THE VOID AWAITS...</span><br>
            Multiple windows = other players<br><br>
            
            <span class="neon-text">NEON IS ETERNAL</span>
        </div>
        
        <div id="chat">
            <div id="chat-messages"></div>
            <div id="chat-input-container">
                <input type="text" id="chat-input" placeholder="TYPE MESSAGE... (ENTER TO SEND)" maxlength="120">
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
